<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PressRecall</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <a class="skip" href="#main">Skip to main content</a>
    <header class="topbar">
      <div class="brand">
        <span class="mark" aria-hidden="true">◳</span>
        <span class="name">PressRecall</span>
        <span class="env" id="chain-badge" hidden></span>
      </div>
      <div class="actorbar">
        <span id="queue-badge" class="queue" hidden></span>
        <span id="actor-chip" class="actor"></span>
        <button id="switch-btn" type="button" class="ghost" hidden>
          Switch actor
        </button>
      </div>
    </header>
    <div id="actor-panel" class="actor-panel" hidden></div>
    <main id="main" tabindex="-1"></main>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
